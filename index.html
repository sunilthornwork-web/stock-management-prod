<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ระบบจัดการสต๊อก</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="phone-frame">
      <section class="login-screen" id="loginScreen" aria-labelledby="loginTitle">
        <div class="test-strip"></div>
        <div class="login-card">
          <p class="eyebrow">ระบบหลังบ้าน</p>
          <h1 id="loginTitle">ระบบจัดการสต๊อก</h1>
          <p class="login-copy">เข้าสู่ระบบด้วยบัญชีที่ได้รับอนุญาต</p>

          <form id="loginForm" class="login-form">
            <label>
              <span>ชื่อผู้ใช้</span>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="กรอกชื่อผู้ใช้" required>
            </label>
            <label>
              <span>รหัสผ่าน</span>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required>
            </label>
            <button id="loginButton" type="submit">เข้าสู่ระบบ</button>
          </form>
          <p class="form-message" id="loginStatus" aria-live="polite"></p>

          <p class="mock-note"></p>
        </div>
      </section>

      <section class="auth-loading is-hidden" id="authLoading" aria-live="polite">
        <div class="test-strip"></div>
        <div class="card">
          <h1>กำลังตรวจสอบเซสชัน</h1>
          <p class="placeholder-text">กรุณารอสักครู่</p>
        </div>
      </section>

      <section class="app-shell is-hidden" id="appShell" aria-label="app shell">
        <header class="app-header">
          <div>
            <p class="eyebrow">ระบบจัดการสต๊อก</p>
            <h1 id="viewTitle">หน้าแรก</h1>
          </div>
          <div class="header-actions">
            <span class="user-chip" id="userChip"></span>
            <button class="logout-button" id="logoutButton" type="button">ออก</button>
            <span class="test-badge"></span>
          </div>
        </header>

        <section class="content-area" id="contentArea" aria-live="polite"></section>

        <nav class="bottom-nav" aria-label="เมนูหลัก">
          <button class="nav-item is-active" type="button" data-view="home">หน้าแรก</button>
          <button class="nav-item" type="button" data-view="orders">ใบสั่งของ</button>
          <button class="nav-item" type="button" data-view="products">สินค้า</button>
          <button class="nav-item" type="button" data-view="stock">สต๊อก</button>
          <button class="nav-item" type="button" data-view="more">เพิ่มเติม</button>
        </nav>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
